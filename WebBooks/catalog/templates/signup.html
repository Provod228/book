{% extends "base_generic.html" %}

{% block content %}
<p>Нажмите кнопку 'регистрация' для регистрации</p>
{% csrf_token %}
    <table>
      <tr>
        <td>Имя пользователя:</td>
        <td>{{ form.username }}</td>
      </tr>
      <tr>
        <td>Пароль:</td>
        <td>{{ form.password }}</td>
      </tr>
    </table>
    <input type="submit" value="Регистрация" />
    <input type="hidden" name="next" value="{{ next }}" />
{% endblock %}
