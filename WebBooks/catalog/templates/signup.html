{% extends "base_generic.html" %}

{% block content %}
<p>Нажмите кнопку 'регистрация' для регистрации</p>
<form method="post" action="{% url 'catalog:signup' %}">
    {% csrf_token %}
    {{ form }}
    <input type="submit" value="Регистрация" />
    <input type="hidden" name="next" value="{{ next }}" />
</form>
{% endblock %}
