{% extends "base_generic.html" %}

{% block content %}
<p>Нажмите кнопку 'регистрация' для регистрации</p>
<form method="post" action="{% url 'catalog:signup' %}">
    {% csrf_token %}
    <button type="submit">регистрация</button>
</form>
<p>Нажмите кнопку 'войти' для входа</p>
<form method="post" action="{% url 'catalog:login' %}">
    {% csrf_token %}
    <button type="submit">войти</button>
</form>
{% endblock %}
